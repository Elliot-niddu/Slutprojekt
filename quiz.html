 <!-- alfastrålning -->
   <p>Vad ger alfastrålning ifrån sig</p>
   <button onclick="checkAnswer('fel')">väte</button>
   <button onclick="checkAnswer('rätt')">Helium</button>

   <p id="resultat"></p>

   <script>
    function checkAnswer(svar) {
      if (svar === "rätt") {
        document.getElementById("resultat").innerHTML = "Rätt svar!";
      } 
      else {
        document.getElementById("resultat").innerHTML = "Fel svar!"
      }
    }
   </script>
